<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kitchen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="clock">--:--</h1>
    <span id="date"></span>
    <div id="shabbat" hidden></div>
  </header>

  <main id="board">
    <div id="tiles"></div>

    <!-- Groceries: a running list. Finished something → it goes on the list; Request → same.
         Already on the list → the person's initial is added to that row. Tap a row once bought. -->
    <section id="grocery" class="panel" aria-label="Groceries">
      <div class="ghead">
        <span id="gicon"></span>
        <span id="gcount"></span>
        <span class="gspacer"></span>
        <button id="gfinished" class="gbtn" type="button" aria-label="Finished something"></button>
        <button id="grequest" class="gbtn" type="button" aria-label="Request something"></button>
      </div>
      <ul id="glist"></ul>
    </section>
  </main>

  <div id="picker" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div id="picker-title"></div>
      <div id="entry" hidden>
        <input id="gitem" type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done" aria-label="What?">
        <div id="gsuggest"></div>
      </div>
      <div id="options"></div>
      <button id="confirm" type="button" aria-label="Done" disabled>
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div id="toast" hidden><span id="toast-text"></span><button id="undo" type="button" aria-label="Undo"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 010 11H11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>

  <!-- Feedback: a round button in the bottom-right corner opens a box to write what to change. -->
  <button id="fbtn" type="button" aria-label="Feedback"></button>
  <div id="fsheet" hidden>
    <div class="sheet fsheet" role="dialog" aria-modal="true" aria-labelledby="ftitle">
      <div class="ftop"><span id="ficon"></span><span id="ftitle">Feedback on the app</span></div>
      <textarea id="ftext" rows="4" placeholder="What should change, what's confusing, what's missing?"></textarea>
      <div id="fwho"></div>
      <div class="fbtns">
        <button id="fcancel" type="button" class="hno">Cancel</button>
        <button id="fsend" type="button" class="fsend" disabled>Send</button>
      </div>
    </div>
  </div>

  <!-- Shabbat / Yom Tov: the tiles fade out and this sky fades in (rest.js). -->
  <div id="rest" aria-live="polite">
    <div id="stars"></div>
    <div id="sun"></div>
    <div id="moon"></div>
    <div class="rcenter">
      <div id="rtitle" lang="he" dir="rtl"></div>
      <div id="rsub" lang="he" dir="rtl"></div>
      <div id="rtimes"></div>
    </div>
    <div id="rclock"></div>
  </div>

  <div id="sleep" hidden></div>

  <script src="env.js"></script><!-- Supabase URL + key; generated, not in git -->
  <script src="icons.js"></script>
  <script src="foods.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="rest.js"></script>
</body>
</html>
